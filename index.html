<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="خريطة تفاعلية لمحافظات ومديريات اليمن، وخريطة الغربة: خط لكل يمني في الخارج من مديريته إلى مدينته" />
    <title>خريطة اليمن</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Thmanyah font files stream from jsDelivr. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  </head>
  <body>
    <div id="map" aria-label="Map"></div>

    <aside id="panel">
      <header class="panel-head">
        <div class="brand">
          <h1 id="app-title"></h1>
          <button id="lang-toggle" type="button"></button>
        </div>
        <div class="search">
          <input
            id="search"
            type="search"
            autocomplete="off"
            spellcheck="false"
            role="combobox"
            aria-expanded="false"
            aria-controls="search-results"
            aria-autocomplete="list"
          />
          <ul id="search-results" role="listbox" hidden></ul>
        </div>
      </header>
      <div id="panel-body"></div>
      <footer id="panel-foot"></footer>
    </aside>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
